---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: "Test Maven Build Action ☕️"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the Maven Build Action with nonrtric-plt-rappmanager ###
  test-maven-build:
    name: "Test Builds"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: "Checkout maven-build-action repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: maven-build-action

      - name: "Checkout nonrtric-plt-rappmanager repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: o-ran-sc/nonrtric-plt-rappmanager
          path: nonrtric-plt-rappmanager

      - name: "Setup Go"
        # yamllint disable-line rule:line-length
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: "Testing setup step"
        shell: bash
        run: |
          # Testing setup step
          echo "Testing maven-build-action"
          echo "Using O-RAN-SC nonrtric-plt-rappmanager project"
          echo "Go version: $(go version)"
          echo "Project structure:"
          ls -la nonrtric-plt-rappmanager/
          echo "Testing setup step/summary output" >> "$GITHUB_STEP_SUMMARY"

      - name: "Running maven-build-action (with global-settings)"
        uses: ./maven-build-action
        with:
          # yamllint disable rule:line-length
          global-settings: |
            <?xml version="1.0" encoding="UTF-8"?>
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                          https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <profiles>
                <profile>
                  <id>ossrh</id>
                  <activation>
                    <activeByDefault>true</activeByDefault>
                  </activation>
                  <repositories>
                    <repository>
                      <id>central</id>
                      <url>https://repo1.maven.org/maven2</url>
                    </repository>
                  </repositories>
                </profile>
              </profiles>
            </settings>
          java-version: '17'
          mvn-version: '3.9.11'
          path_prefix: 'nonrtric-plt-rappmanager'
          mvn-phases: 'clean compile test'
          # Distinct names: the badge artifact defaults to one name per
          # job, and this job runs the action twice, so both uploads
          # would claim the same name and the second fails with a 409.
          artifact-name: 'maven-build-with-global-settings'
          mvn-opts: >-
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
            -Dmaven.repo.local=/tmp/r -Dorg.ops4j.pax.url.mvn.localRepository=/tmp/r
          # yamllint enable rule:line-length

      - name: "Running maven-build-action (without global-settings)"
        uses: ./maven-build-action
        with:
          java-version: '17'
          mvn-version: '3.9.11'
          path_prefix: 'nonrtric-plt-rappmanager'
          mvn-phases: 'clean compile'
          artifact-name: 'maven-build-without-global-settings'
          # yamllint disable rule:line-length
          mvn-opts: >-
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
            -Dmaven.repo.local=/tmp/r -Dorg.ops4j.pax.url.mvn.localRepository=/tmp/r
          # yamllint enable rule:line-length

      - name: "Summary: maven-build-action"
        shell: bash
        run: |
          # Summary: maven-build-action
          echo "Test builds completed successfully ✅"
          echo "Test builds completed successfully ✅" >> "$GITHUB_STEP_SUMMARY"

  ### Test failure scenarios ###
  test-argument-expansion:
    name: "Test Argument Expansion"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: "Checkout maven-build-action repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The set of names the action expands is a security boundary: the
      # build step holds credentials. Needs none itself, so it runs on
      # pull requests from forks.
      - name: "Check the workspace-variable allowlist"
        shell: bash
        run: ./tests/expand-workspace-vars.sh

  test-jacoco-mode:
    name: "Test JaCoCo Mode Resolution"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: "Checkout maven-build-action repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run the JaCoCo mode test suite"
        shell: bash
        run: |
          ./tests/jacoco-mode.sh

  test-subproject-coverage:
    name: "Test Subproject Coverage"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: "Checkout maven-build-action repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The fixture holds its code in 'core' and its only test in 'app',
      # so a report built per subproject credits core with nothing.
      - name: "Build the fixture reactor"
        id: first-build
        uses: ./
        with:
          path_prefix: "tests/fixtures/multi-subproject"
          mvn-phases: "clean verify"
          run-jacoco: "true"
          artifact-upload: "false"

      - name: "Check coverage crosses the subproject boundary"
        shell: bash
        env:
          COVERAGE: ${{ steps.first-build.outputs.coverage }}
        run: |
          set -euo pipefail
          ./tests/check-subproject-coverage.sh \
            tests/fixtures/multi-subproject expect-covered
          # The badge generator defaults to the root
          # target/site/jacoco/jacoco.csv, and a reactor root is
          # packaging pom, so it builds no such file. Without the
          # subproject CSV reports the badge and summary stay empty
          # beside perfectly good coverage.
          if [ -z "$COVERAGE" ]; then
            echo "The coverage output is empty despite reports" >&2
            exit 1
          fi
          echo "Coverage reported: $COVERAGE"

      # A failed build skips nothing that owns the start marker: the
      # report step claims it under always(), so a runner that keeps its
      # temporary directory does not accumulate them.
      - name: "Build a reactor that fails"
        id: failing-build
        continue-on-error: true
        uses: ./
        with:
          path_prefix: "tests/fixtures/multi-subproject"
          mvn-phases: "clean no-such-phase"
          run-jacoco: "true"
          artifact-upload: "false"

      - name: "Check the failed build left no start marker"
        shell: bash
        env:
          OUTCOME: ${{ steps.failing-build.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != 'failure' ]; then
            echo "Expected the build to fail, got '$OUTCOME'" >&2
            exit 1
          fi
          LEFTOVER="$(find "$RUNNER_TEMP" -maxdepth 1 \
            -name 'jacoco-build-start.*' -print 2>/dev/null)"
          if [ -n "$LEFTOVER" ]; then
            echo "Start marker survived a failed build:" >&2
            echo "$LEFTOVER" >&2
            exit 1
          fi
          echo "No start marker left behind"

      # A parallel reactor has several agents appending to one file at
      # once, so the action leaves the layout alone. Each subproject then
      # reports its own data, and core shows nothing. Wrong-but-honest
      # beats corrupt.
      - name: "Build the fixture reactor in parallel"
        uses: ./
        with:
          path_prefix: "tests/fixtures/multi-subproject"
          mvn-phases: "clean verify"
          mvn-params: "-T 2"
          run-jacoco: "true"
          artifact-upload: "false"

      - name: "Check the parallel build kept the project layout"
        shell: bash
        run: |
          ./tests/check-subproject-coverage.sh \
            tests/fixtures/multi-subproject expect-none

      # An explicit shared mode is the caller deciding the layout, so the
      # action's own -D has to beat a JaCoCo path arriving in mvn-params.
      # Maven honours the last repeated -D, so ordering decides this.
      - name: "Build with a caller JaCoCo path alongside shared mode"
        id: shared-override
        uses: ./
        with:
          path_prefix: "tests/fixtures/multi-subproject"
          mvn-phases: "clean verify"
          jacoco-mode: "shared"
          mvn-params: "-Djacoco.destFile=/tmp/caller-owned.exec"
          run-jacoco: "true"
          artifact-upload: "false"

      - name: "Check shared mode won and the paths are absolute"
        shell: bash
        env:
          REPORTS: ${{ steps.shared-override.outputs.coverage_report_paths }}
        run: |
          set -euo pipefail
          ./tests/check-subproject-coverage.sh \
            tests/fixtures/multi-subproject expect-covered
          # Sonar resolves these against each subproject basedir, so a
          # relative path would be joined onto every subproject and find
          # nothing.
          case "$REPORTS" in
            /*) echo "coverage_report_paths is absolute: $REPORTS" ;;
            '') echo "No coverage report paths reported" >&2; exit 1 ;;
            *) echo "Not absolute: $REPORTS" >&2; exit 1 ;;
          esac

      # A project that turns JaCoCo off by property while its agent
      # execution turns it back on. The agent writes, so coverage must
      # reach the report: the report pass has to lift the property, or
      # it exits zero having written no XML at all.
      - name: "Build the fixture reactor with JaCoCo skipped by property"
        uses: ./
        with:
          path_prefix: "tests/fixtures/multi-subproject"
          mvn-phases: "clean verify"
          mvn-profiles: "skip-by-property"
          run-jacoco: "true"
          artifact-upload: "false"

      - name: "Check the property-skipped build still reports coverage"
        shell: bash
        run: |
          ./tests/check-subproject-coverage.sh \
            tests/fixtures/multi-subproject

      # A project that runs tests without a JaCoCo agent must build and
      # pass. The report step fails a shared-mode build that ran tests and
      # produced no data, so a gate that mistakes a declared plugin for a
      # running one would break an ordinary project.
      - name: "Build the fixture reactor with the agent skipped"
        uses: ./
        with:
          path_prefix: "tests/fixtures/multi-subproject"
          mvn-phases: "clean verify"
          mvn-params: "-Djacoco.skip=true"
          run-jacoco: "true"
          artifact-upload: "false"

      - name: "Check the skipped build produced no coverage"
        shell: bash
        run: |
          ./tests/check-subproject-coverage.sh \
            tests/fixtures/multi-subproject expect-none

      # jacoco-mode off leaves the build exactly as it was.
      - name: "Build the fixture reactor with aggregation off"
        uses: ./
        with:
          path_prefix: "tests/fixtures/multi-subproject"
          mvn-phases: "clean verify"
          jacoco-mode: "off"
          run-jacoco: "true"
          artifact-upload: "false"

      - name: "Check aggregation off changed nothing"
        shell: bash
        run: |
          ./tests/check-subproject-coverage.sh \
            tests/fixtures/multi-subproject expect-none

  test-failure-scenarios:
    name: "Test Build Failure"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: "Checkout maven-build-action repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # yamllint disable-line rule:line-length
      - name: "Test failure: Invalid path_prefix"
        uses: ./
        id: failure-test
        continue-on-error: true
        with:
          java-version: '17'
          mvn-version: '3.9.11'
          path_prefix: 'non-existent-directory'

      # Failure testing is also important
      - name: "Error if step above did NOT fail"
        if: steps.failure-test.outcome == 'success'
        shell: bash
        run: |
          # Error if step above did NOT fail
          echo "Error: previous test step did NOT fail as expected ❌"
          exit 1

      - name: "Validated failure scenario"
        if: steps.failure-test.outcome == 'failure'
        shell: bash
        run: |
          # Validated failure scenario
          echo "Validated failure scenario: invalid path_prefix ✅"
